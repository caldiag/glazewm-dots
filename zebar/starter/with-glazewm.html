<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Custom styles. -->
  <link rel="stylesheet" type="text/css" href="./styles.css" />

  <!-- Allows React to be run buildless via "text/babel" script below. -->
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
    integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo=" crossorigin="anonymous"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, {
      useState,
      useEffect,
    } from 'https://esm.sh/react@18?dev';
    import {createRoot} from 'https://esm.sh/react-dom@18/client?dev';
    import * as zebar from 'https://esm.sh/zebar@2';

    const providers = zebar.createProviderGroup({
      network: {type: 'network'},
      glazewm: {type: 'glazewm'},
      date: {type: 'date', formatting: 'EEE d MMM t', locale: "pt-br"},
      battery: {type: 'battery'},
      audio: {type: 'audio'},
      keyboard: {type: 'keyboard'},
      media: {type: 'media'}
    });

    createRoot(document.getElementById('root')).render(<App />);

    function App() {
      const [output, setOutput] = useState(providers.outputMap);

      useEffect(() => {
        providers.onOutput(() => {
          setOutput(providers.outputMap)
        });
      }, []);

      // Get icon to show for current network status.
      function getNetworkIcon(networkOutput) {
        switch (networkOutput.defaultInterface?.type) {
          case 'ethernet':
            return <i className="nf nf-md-ethernet_cable"></i>;
          case 'wifi':
            return <i className="nf nf-fa-wifi"></i>;
          default:
            return (
              <i className="nf nf-fa-wifi_strength_off_outline"></i>
            );
        }
      }

      function truncateMediaTitle(mediaSession) {
        const title = mediaSession.title ? mediaSession.title : "Unknown"
        const artist = mediaSession.artist ? mediaSession.artist : "Unknown"
        return (artist + " - " + title).length > 35 ? (artist + " - " + title).substring(0, 35) + "..." : artist + " - " + title
      }
      // Get icon to show for how much of the battery is charged.
      function getBatteryIcon(batteryOutput) {
        if (batteryOutput.chargePercent > 90)
          return <i className="nf nf-fa-battery_4"></i>;
        if (batteryOutput.chargePercent > 70)
          return <i className="nf nf-fa-battery_3"></i>;
        if (batteryOutput.chargePercent > 40)
          return <i className="nf nf-fa-battery_2"></i>;
        if (batteryOutput.chargePercent > 20)
          return <i className="nf nf-fa-battery_1"></i>;
        return <i className="nf nf-fa-battery_0"></i>;
      }

      function getAudioIcon(audioOutput) {
        if (!audioOutput.defaultPlaybackDevice) return <i className="nf nf-fa-volume_xmark"></i>
        if (audioOutput.defaultPlaybackDevice.volume > 80)
          return <i className="nf nf-fa-volume_high"></i>;
        if (audioOutput.defaultPlaybackDevice.volume > 40)
          return <i className="nf nf-fa-volume_low"></i>;
        if (audioOutput.defaultPlaybackDevice.volume > 20)
          return <i className="nf nf-fa-volume_off"></i>;
        return <i className="nf nf-fa-volume_xmark"></i>;
      }

      return (
        <div className="app">
          <div className="left">
            {output.glazewm && (
              <div className="workspaces">
                {output.glazewm.currentWorkspaces.map(workspace => (
                  <button
                    className={`workspace ${workspace.hasFocus && 'focused'} ${workspace.isDisplayed && 'displayed'}`}
                    onClick={() =>
                      output.glazewm.runCommand(
                        `focus --workspace ${workspace.name}`,
                      )
                    }
                    key={workspace.name}
                  >
                    {workspace.displayName ?? workspace.name}
                  </button>
                ))}
              </div>
            )}
          </div>

          <div className="center">

          </div>

          <div className="right">
            {output.media && output.media.currentSession?.isPlaying && (
              <div>
                <i className="nf nf-fa-itunes_note" style={{marginRight: 10}}></i>{truncateMediaTitle(output.media.currentSession)}
              </div>
            )}
            <div>{output.keyboard?.layout.substring(3, 5)}</div>
            {output.network && (
              <div className="network">
                {getNetworkIcon(output.network)}
                {/*output.network.defaultGateway?.ssid*/}
              </div>
            )}

            {output.audio && (
              <div className="network">
                {getAudioIcon(output.audio)}
              </div>
            )}

            {output.battery && (
              <div className="battery">
                {/* Show icon for whether battery is charging. */}
                <div>
                  {Math.round(output.battery.chargePercent) + "%"}
                </div>
                <div>
                  {getBatteryIcon(output.battery)}
                </div>
                {output.battery.isCharging && (
                  <i className="nf nf-md-lightning_bolt"></i>
                )}
              </div>
            )}
            <div className="date">{output.date?.formatted}</div>

          </div>
        </div>
      );
    }
  </script>
</body>

</html>
